services:
  - type: web
    name: xqksh-zxxq-mineru-zmdyy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-mineru.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 600 mineru_server:app
    healthCheckPath: /health
    envVars:
      - key: MINERU_SERVE_APP
        value: "0"
      - key: ALLOWED_ORIGINS
        value: "https://zmdyy.github.io,http://127.0.0.1:5500,http://localhost:5500"
